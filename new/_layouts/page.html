---
layout: default
---
<div class="docs-layout">
  <aside class="docs-sidebar" aria-label="Navegación de documentación">
    <div class="docs-sidebar-title">Documentación</div>
    <nav>
      {% for item in site.navigation %}
        {% if item.url %}
          <a class="docs-nav-link{% if page.url == item.url %} is-active{% endif %}" href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% else %}
          <div class="docs-nav-heading">{{ item.title }}</div>
          {% for child in item.children %}
            <a class="docs-nav-link docs-nav-child{% if page.url == child.url %} is-active{% endif %}" href="{{ child.url | relative_url }}">{{ child.title }}</a>
          {% endfor %}
        {% endif %}
      {% endfor %}
    </nav>
  </aside>

  <main class="docs-content">
    <article class="post">
      <header class="post-header">
        <h1 class="post-title">{{ page.title | escape }}</h1>
      </header>
      <div class="post-content">
        {{ content }}
      </div>
    </article>
  </main>
</div>
